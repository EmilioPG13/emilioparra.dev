name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The two steps below only warn until Phase 3 (launch). Remove
      # continue-on-error then so that broken links and a Lighthouse
      # regression block the merge.
      - name: Broken links
        run: npm run links
        continue-on-error: true

      - name: Lighthouse CI
        run: npm run lighthouse
        continue-on-error: true
